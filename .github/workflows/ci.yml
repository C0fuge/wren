# Build and test the Spark connector. The server repository's artifacts (client core, server and
# its test-jar) are built first at the commit pinned in kestrel.ref (scripts/install-kestrel.sh).
# Tests: unit + Spark local mode + in-process server (all tags except perf and real-services),
# then Checkstyle and SpotBugs.
name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      kestrel_ref:
        description: "Server repository commit/branch to build against (default: kestrel.ref)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: --batch-mode --errors --no-transfer-progress
  LC_ALL: C.UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Server artifacts (kestrel at kestrel.ref)
        env:
          KESTREL_REF: ${{ inputs.kestrel_ref }}
        run: |
          [ -n "$KESTREL_REF" ] || unset KESTREL_REF
          scripts/install-kestrel.sh

      - name: Build, tests (no perf / real-services), Checkstyle, SpotBugs
        run: ./mvnw clean verify checkstyle:check spotbugs:check

      - name: Test summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t = [0, 0, 0, 0]
          for f in glob.glob("target/surefire-reports/TEST-*.xml"):
              s = ET.parse(f).getroot()
              for i, k in enumerate(("tests", "failures", "errors", "skipped")):
                  t[i] += int(s.get(k, 0))
          print("| tests | failures | errors | skipped |\n|---|---|---|---|")
          print("| " + " | ".join(map(str, t)) + " |")
          EOF

      - name: Surefire reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore
